<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Senira Pipeline Architecture</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  color-scheme: light;
  --bg:#f1f0ea; --panel:#fbfaf6; --line:#dad7cc; --line2:#c2beaf;
  --ink:#191b17; --ink2:#54574c; --ink3:#83867a; --s1:#2a78d6; --crit:#d03b3b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#131510; --panel:#1b1e18; --line:#333829; --line2:#454b3a;
    --ink:#eef0e6; --ink2:#a9ae9c; --ink3:#7d8272; --s1:#3987e5; --crit:#d03b3b;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#131510; --panel:#1b1e18; --line:#333829; --line2:#454b3a;
  --ink:#eef0e6; --ink2:#a9ae9c; --ink3:#7d8272; --s1:#3987e5; --crit:#d03b3b;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif; font-size:13px; line-height:1.45;
  display:grid; place-items:center; padding:24px 16px;
  -webkit-font-smoothing:antialiased;
}
.card{width:100%; max-width:360px}
.mk{font-weight:700; font-size:15px; letter-spacing:.02em; font-variation-settings:"wdth" 96}
.sub{
  font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; font-weight:600;
  color:var(--ink3); font-variation-settings:"wdth" 112; margin-top:2px;
}
form{
  margin-top:20px; background:var(--panel); border:1px solid var(--line);
  border-radius:3px; padding:16px; display:flex; flex-direction:column; gap:11px;
}
label{
  font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; font-weight:600;
  color:var(--ink3); display:block; margin-bottom:4px; font-variation-settings:"wdth" 112;
}
input{
  width:100%; padding:7px 9px; font:inherit; font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:13px; color:var(--ink); background:var(--bg);
  border:1px solid var(--line2); border-radius:2px;
}
input:focus{outline:2px solid var(--s1); outline-offset:1px; border-color:var(--s1)}
button{
  font:inherit; font-weight:600; font-size:12.5px; padding:8px 10px; margin-top:3px;
  color:var(--bg); background:var(--ink); border:1px solid var(--ink);
  border-radius:2px; cursor:pointer;
}
button:hover{opacity:.88}
button:disabled{opacity:.5; cursor:progress}
.msg{font-size:11.5px; min-height:16px; color:var(--crit); font-weight:500}
.msg.work{color:var(--ink3); font-weight:400}
.note{font-size:10.5px; color:var(--ink3); line-height:1.5; margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="card">
  <div class="mk">SENIRA</div>
  <div class="sub">Pipeline Architecture &middot; Winter Wheat</div>
  <form id="f" autocomplete="off">
    <div>
      <label for="u">User</label>
      <input id="u" name="u" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    </div>
    <div>
      <label for="p">Password</label>
      <input id="p" name="p" type="password" required>
    </div>
    <button id="go" type="submit">Unlock</button>
    <div class="msg" id="m" role="status" aria-live="polite"></div>
  </form>
  <p class="note">This page holds the internal architecture of the winter wheat
  pipeline. It is stored encrypted and is decrypted in your browser;
  credentials are never sent anywhere.</p>
</div>
